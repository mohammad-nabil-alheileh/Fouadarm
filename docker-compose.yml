services:
  web_backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: fouad-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mounts your local backend folder to the container's /app directory
      # This ensures migrations generated inside the container sync to your host machine
      - ./backend:/app
      - ./logs:/app/logs
    environment:
      # Ensure these variables are populated or match your DB service name if using one in compose
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}

  web_frontend:
    build:
      context: .                  
      dockerfile: ./frontend/Dockerfile
    container_name: fouad-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - web_backend