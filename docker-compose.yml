services:
  db:
    image: postgres:16-alpine
    container_name: fouad-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=fouad_user
      - POSTGRES_PASSWORD=fouad_pass
      - POSTGRES_DB=fouad_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  web_backend:
    build:
      context: .
      dockerfile: ./backend/dockerfile
    container_name: fouad-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mounts your local backend folder to the container's /app directory
      # This ensures migrations generated inside the container sync to your host machine
      - ./backend:/app
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://fouad_user:fouad_pass@db:5432/fouad_db
    depends_on:
      db:
        condition: service_healthy

  web_frontend:
    build:
      context: .
      dockerfile: ./frontend/dockerfile
    container_name: fouad-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - web_backend

volumes:
  postgres_data: