<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشتل تفال - نتائج بحث الاسم</title>
    <link rel="stylesheet" href="css/index.css">

<body>

    <div class="layout">
        
        <aside class="sidebar">
